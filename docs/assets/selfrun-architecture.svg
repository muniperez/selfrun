<svg xmlns="http://www.w3.org/2000/svg" width="980" height="192" viewBox="0 0 980 192" role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">Selfrun platform overview</title>
  <desc id="arch-desc">From the CLI, web console, or CI, you connect over HTTPS to a single Control Plane VPS hosted once, which provisions isolated App VPSs in your cloud account—one per environment—with automatic HTTPS.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 1L9 5L0 9Z" fill="#404040"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0 1L9 5L0 9Z" fill="#737373"/>
    </marker>
  </defs>
  <style>
    text {
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      fill: #171717;
    }
    .mono {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }
    .meta {
      font-size: 11px;
      font-weight: 600;
      fill: #737373;
    }
    .title {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.02em;
      fill: #171717;
    }
    .item {
      font-size: 13px;
      fill: #404040;
    }
    .edge {
      font-size: 11.5px;
      font-weight: 600;
      fill: #404040;
    }
    .edge-muted {
      font-size: 11px;
      fill: #737373;
    }
    .node {
      fill: #ffffff;
      stroke: #d4d4d4;
      stroke-width: 1.25;
    }
    .node-stack {
      fill: #f3f3f3;
      stroke: #dcdcdc;
      stroke-width: 1.25;
    }
    .solid {
      fill: none;
      stroke: #404040;
      stroke-width: 1.5;
      stroke-linecap: round;
      marker-end: url(#arrow);
    }
    .dashed {
      fill: none;
      stroke: #737373;
      stroke-width: 1.35;
      stroke-dasharray: 4 4;
      stroke-linecap: round;
      marker-end: url(#arrow-muted);
    }
  </style>

  <rect width="980" height="192" rx="8" fill="#fafafa"/>

  <!-- 1. Workflow -->
  <g>
    <rect x="4" y="14" width="220" height="160" rx="8" class="node"/>
    <text x="24" y="40" class="meta">You &amp; automation</text>
    <text x="24" y="63" class="title">Workflow</text>
    <text x="24" y="95" class="item"><tspan class="mono" fill="#171717">selfrun</tspan> CLI</text>
    <text x="24" y="120" class="item">Web console</text>
    <text x="24" y="145" class="item">CI &amp; coding agents</text>
  </g>

  <!-- Arrow 1 -->
  <text x="268" y="84" text-anchor="middle" class="edge">HTTPS</text>
  <path d="M224 94H310" class="solid"/>

  <!-- 2. Control Plane -->
  <g>
    <rect x="312" y="14" width="284" height="160" rx="8" class="node"/>
    <text x="332" y="40" class="meta">1 VPS · hosted once</text>
    <text x="332" y="63" class="title">Control Plane VPS</text>
    <text x="332" y="95" class="item">Dashboard, API &amp; access control</text>
    <text x="332" y="120" class="item">Builds, deployments &amp; secrets</text>
    <text x="332" y="145" class="item">Provisions VMs in your cloud</text>
  </g>

  <!-- Arrow 2 -->
  <text x="644" y="70" text-anchor="middle" class="edge">Deploys</text>
  <path d="M596 80H690" class="solid"/>

  <path d="M692 114H598" class="dashed"/>
  <text x="644" y="133" text-anchor="middle" class="edge-muted">Health &amp; logs</text>

  <!-- 3. Deployed Apps (stacked slightly to show 1 VPS per env) -->
  <g>
    <rect x="700" y="20" width="276" height="160" rx="8" class="node-stack"/>
    <rect x="692" y="14" width="276" height="160" rx="8" class="node"/>
    <text x="712" y="40" class="meta">Your cloud · 1 VPS per env</text>
    <text x="712" y="63" class="title">Deployed Apps</text>
    <text x="712" y="95" class="item">Web apps, private APIs &amp; workers</text>
    <text x="712" y="120" class="item">Databases &amp; persistent storage</text>
    <text x="712" y="145" class="item">Automatic HTTPS &amp; custom domains</text>
  </g>
</svg>
