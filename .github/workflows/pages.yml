name: Publish landing page

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  cli:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    uses: ./.github/workflows/cli-seed-review.yml

  package:
    needs: cli
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Stage the landing page and approved documentation assets
        run: site/build.sh "$RUNNER_TEMP/minicloud-pages"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: minicloud-seed-*
          path: ${{ runner.temp }}/cli-builds
      - name: Stage the four CLI downloads
        shell: bash
        run: |
          set -euo pipefail
          destination="$RUNNER_TEMP/minicloud-pages/downloads"
          mkdir "$destination"
          for rid in linux-x64 linux-arm64 osx-arm64 win-x64; do
            name="minicloud-seed-$rid"
            extension=tar.gz
            if [[ "$rid" == win-x64 ]]; then extension=zip; fi
            cd "$RUNNER_TEMP/cli-builds/$name"
            sha256sum --check --strict checksums.txt
            install -m 644 "$name.$extension" "$destination/"
          done
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/minicloud-pages

  deploy:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy reviewed site
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
