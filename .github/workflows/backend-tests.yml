name: Backend tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SELFRUN_TEST_PREFLIGHT_SSH_IMAGE: selfrun-ssh-bootstrap-test:${{ github.run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Reclaim runner disk for registry integration tests
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/swift /opt/ghc
          df -h /
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Verify runtime bootstrap ordering and argument handling
        run: python3 scripts/github-actions/selfrun-deploy/test-runtime-bootstrap.py
      - name: Verify health-gated app rollout and rollback
        run: python3 -B scripts/github-actions/selfrun-deploy/test-runtime-rollout.py
      - name: Build the disposable SSH bootstrap test fixture
        run: docker build --tag "$SELFRUN_TEST_PREFLIGHT_SSH_IMAGE" --file modules/tests/Selfrun.Worker.Tests/Fixtures/SshBootstrap.Dockerfile .
      - name: Verify database capture, restore, retention and isolation
        run: |
          python3 -B -m unittest discover -s scripts/database-platform -p 'test_*.py' -q
          python3 -B -m unittest discover -s modules/backup-repository -p 'test_*.py' -q
          python3 scripts/database-platform/test-postgres-integration.py
      - name: Install authenticated recovery test dependency
        env:
          AGE_VERSION: v1.3.2
          AGE_SHA256: cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10
        run: |
          # Pinned upstream release instead of the Ubuntu archive; the checksum must match exactly.
          archive="$RUNNER_TEMP/age.tar.gz"
          curl -fsSL --retry 3 -o "$archive" "https://github.com/FiloSottile/age/releases/download/${AGE_VERSION}/age-${AGE_VERSION}-linux-amd64.tar.gz"
          echo "${AGE_SHA256}  ${archive}" | sha256sum -c -
          sudo tar -xzf "$archive" -C /usr/local/bin --strip-components=1 age/age age/age-keygen
          age --version
      - name: Verify self-hosting initialization scripts
        run: python3 -B -m unittest discover -s scripts/self-hosting -p 'test_*.py' -q
      - name: Provision PostgreSQL 16 for the upgrade rehearsal
        run: |
          set -euo pipefail
          . /etc/os-release
          curl -fsSL --retry 3 https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo tee /usr/share/keyrings/selfrun-pgdg.asc >/dev/null
          printf 'deb [signed-by=/usr/share/keyrings/selfrun-pgdg.asc] https://apt.postgresql.org/pub/repos/apt %s-pgdg main\n' \
            "$VERSION_CODENAME" | sudo tee /etc/apt/sources.list.d/selfrun-pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-16 postgresql-client-16
      - name: Rehearse the retired-workspace PostgreSQL upgrade
        id: workspace-upgrade
        env:
          PG_BIN: /usr/lib/postgresql/16/bin
        run: python3 -u scripts/self-hosting/test-workspace-upgrade.py
      - name: Preserve synthetic upgrade dump diffs
        if: failure() && steps.workspace-upgrade.outcome == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: workspace-upgrade-diffs
          path: .local/artifacts/workspace-upgrade-diffs/*.diff
          include-hidden-files: true
          if-no-files-found: ignore
      - name: Run backend, worker, CLI and deployment integration tests
        run: dotnet test Selfrun.slnx --configuration Release -m:1
      - name: Publish and smoke-test the source-built CLI
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          version="0.0.0-source.sha${SOURCE_REVISION:0:12}"
          output="$GITHUB_WORKSPACE/.local/artifacts/cli-smoke/publish"
          mkdir -p "$output"
          echo "Publishing CLI source revision $SOURCE_REVISION"
          dotnet publish modules/cli/Selfrun.Cli.csproj \
            --configuration Release \
            --runtime linux-x64 \
            --self-contained true \
            --artifacts-path "$GITHUB_WORKSPACE/.local/artifacts/cli-smoke/build" \
            --output "$output" \
            -p:Version="$version" \
            -p:SourceRevisionId="$SOURCE_REVISION" \
            -p:InformationalVersion="$version+sha.$SOURCE_REVISION"
          python3 scripts/verify-cli-release.py "$output/selfrun" "$version"

  bootstrap-arm64-tests:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Run protected bootstrap tests on ARM64
        run: dotnet test modules/tests/Selfrun.Tests/Selfrun.Tests.csproj --configuration Release -m:1 --filter "FullyQualifiedName~BootstrapServiceTests"
