name: Backend tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MINICLOUD_TEST_PREFLIGHT_SSH_IMAGE: minicloud-ssh-bootstrap-test:${{ github.run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Build the disposable SSH bootstrap test fixture
        run: docker build --tag "$MINICLOUD_TEST_PREFLIGHT_SSH_IMAGE" --file modules/tests/Minicloud.Worker.Tests/Fixtures/SshBootstrap.Dockerfile .
      - name: Repeat worker tests
        run: |
          dotnet build modules/tests/Minicloud.Worker.Tests -c Release -v q
          for i in $(seq 1 6); do echo "### run $i"; dotnet test modules/tests/Minicloud.Worker.Tests -c Release --no-build 2>&1 | grep -E "Passed!|Failed!|^\s+Failed Mini|Error Message" -A3 || true; done
      - name: Diagnostics
        if: always()
        run: |
          cat /tmp/poollag.log || true
          grep -B1 -A3 "HttpClient.Timeout" /tmp/wsdiag.log | grep -E "^20|Timeout" || true
