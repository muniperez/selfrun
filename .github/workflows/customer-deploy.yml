# SPDX-License-Identifier: MPL-2.0
name: Selfrun Customer Deploy (formerly MiniCloud)

on:
  workflow_call:
    inputs:
      app_id:
        required: true
        type: string
      database:
        required: false
        type: string
        default: sqlite
      selfrun_environment:
        description: "Hosted environment alias (prod or staging). Overrides minicloud_environment when set."
        required: false
        type: string
        default: ""
      minicloud_environment:
        required: false
        type: string
        default: prod
      services:
        required: true
        type: string
      selfrun_version:
        description: "Exact CLI commit SHA or CLI tag (for example v3.1.0). Overrides minicloud_version when set."
        required: false
        type: string
        default: ""
      minicloud_version:
        required: false
        type: string
        default: 2a5ae0ccea6c3dd680b4146586ec0668c60c8b93
      selfrun_api_url:
        description: "HTTPS API origin for a self-hosted Selfrun instance. Overrides minicloud_api_url when set."
        required: false
        type: string
        default: ""
      minicloud_api_url:
        description: "HTTPS API origin for a self-hosted Selfrun (formerly MiniCloud) instance."
        required: false
        type: string
        default: ""
      selfrun_app_domain:
        description: "Generated application hostname suffix for a self-hosted instance. Overrides minicloud_app_domain when set."
        required: false
        type: string
        default: ""
      minicloud_app_domain:
        description: "Generated application hostname suffix for a self-hosted instance."
        required: false
        type: string
        default: ""
    secrets:
      selfrun_api_key:
        required: false
      minicloud_api_key:
        required: false
      postgres_password:
        required: false

permissions:
  contents: read

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: Build Selfrun CLI from verified source
        env:
          SELFRUN_VERSION_INPUT: ${{ inputs.selfrun_version }}
          MINICLOUD_VERSION_INPUT: ${{ inputs.minicloud_version }}
        shell: bash
        run: |
          set -euo pipefail
          CLI_VERSION_REF="${SELFRUN_VERSION_INPUT:-${MINICLOUD_VERSION_INPUT}}"
          if [[ "$CLI_VERSION_REF" =~ ^[0-9a-f]{40}$ ]]; then
            expected_sha="$CLI_VERSION_REF"
            cli_version="0.0.0-source.sha${CLI_VERSION_REF:0:12}"
          elif [[ "$CLI_VERSION_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            tag_ref="refs/tags/$CLI_VERSION_REF"
            remote_before="$(git ls-remote https://github.com/muniventures/minicloud.git "$tag_ref" "$tag_ref^{}")"
            expected_sha="$(printf '%s\n' "$remote_before" | awk -v ref="$tag_ref" '$2 == ref { tag=$1 } $2 == ref "^{}" { peeled=$1 } END { if (peeled != "") print peeled; else print tag }')"
            if [[ ! "$expected_sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "CLI tag $CLI_VERSION_REF was not found in the canonical repository." >&2
              exit 1
            fi
            cli_version="${CLI_VERSION_REF#v}"
          else
            echo "selfrun_version / minicloud_version must be a full lowercase commit SHA or exact CLI tag (for example v3.1.0); branches, latest, and server-v tags are not supported." >&2
            exit 1
          fi

          build_root="$(mktemp -d "${RUNNER_TEMP}/minicloud-cli-build.XXXXXX")"
          source_dir="${build_root}/source"
          publish_dir="${build_root}/publish"
          git clone --filter=blob:none --no-tags --single-branch --branch main \
            https://github.com/muniventures/minicloud.git "$source_dir"
          if [[ -n "${tag_ref:-}" ]]; then
            git -C "$source_dir" fetch --no-tags origin "$tag_ref:$tag_ref"
            fetched_sha="$(git -C "$source_dir" rev-parse "$tag_ref^{commit}")"
            remote_after="$(git ls-remote https://github.com/muniventures/minicloud.git "$tag_ref" "$tag_ref^{}")"
            remote_after_sha="$(printf '%s\n' "$remote_after" | awk -v ref="$tag_ref" '$2 == ref { tag=$1 } $2 == ref "^{}" { peeled=$1 } END { if (peeled != "") print peeled; else print tag }')"
            if [[ "$fetched_sha" != "$expected_sha" || "$remote_after_sha" != "$expected_sha" ]]; then
              echo "CLI tag $CLI_VERSION_REF changed while its source was being acquired; retry with a reviewed commit SHA." >&2
              exit 1
            fi
          fi
          if ! git -C "$source_dir" merge-base --is-ancestor "$expected_sha" refs/remotes/origin/main; then
            echo "Selected CLI source $expected_sha is not in canonical main." >&2
            exit 1
          fi
          git -C "$source_dir" checkout --detach "$expected_sha"
          resolved_sha="$(git -C "$source_dir" rev-parse HEAD)"
          if [[ "$resolved_sha" != "$expected_sha" ]]; then
            echo "Resolved source revision did not match the selected revision." >&2
            exit 1
          fi
          echo "Building Selfrun CLI from muniventures/minicloud at $resolved_sha"
          cd "$source_dir"
          dotnet publish "$source_dir/modules/cli/Minicloud.Cli.csproj" \
            --configuration Release \
            --runtime linux-x64 \
            --self-contained true \
            --output "$publish_dir" \
            -p:Version="$cli_version" \
            -p:SourceRevisionId="$resolved_sha" \
            -p:InformationalVersion="$cli_version+sha.$resolved_sha"
          mv "$publish_dir/Minicloud.Cli" "$publish_dir/minicloud"
          ln -s minicloud "$publish_dir/selfrun"
          python3 "$source_dir/scripts/verify-cli-release.py" "$publish_dir/minicloud" "$cli_version"
          echo "$publish_dir" >> "$GITHUB_PATH"

      - name: Generate Selfrun config
        env:
          APP_ID: ${{ inputs.app_id }}
          DATABASE: ${{ inputs.database }}
          SERVICES_INPUT: ${{ inputs.services }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${APP_ID}" ]; then
            echo "app_id is required. Use the app id from the Selfrun console URL, for example app_52kqllu8k1nq4kg352kqllu8."
            exit 1
          fi

          if ! [[ "${APP_ID}" =~ ^app_[A-Za-z0-9]+$ ]]; then
            echo "app_id must look like app_52kqllu8k1nq4kg352kqllu8."
            exit 1
          fi

          case "${DATABASE}" in
            sqlite|postgres|none)
              ;;
            *)
              echo "database must be sqlite, postgres, or none."
              exit 1
              ;;
          esac

          ruby -ryaml -e '
            services = YAML.safe_load(ENV.fetch("SERVICES_INPUT"), permitted_classes: [], aliases: false)
            unless services.is_a?(Array) && services.any?
              warn "services must be a non-empty YAML array"
              exit 1
            end

            config = {
              "app" => "github-actions",
              "appId" => ENV.fetch("APP_ID"),
              "database" => ENV.fetch("DATABASE"),
              "commitSha" => ENV.fetch("GITHUB_SHA"),
              "services" => {}
            }

            services.each do |service|
              unless service.is_a?(Hash)
                warn "each service must be a YAML mapping"
                exit 1
              end

              name = service["name"]
              unless name.is_a?(String) && name.match?(/\A[a-z0-9][a-z0-9_-]*\z/)
                warn "service names must use lowercase letters, numbers, dashes, and underscores"
                exit 1
              end

              if config["services"].key?(name)
                warn "service names must be unique"
                exit 1
              end

              known = %w[name sourcePath dockerfile image port public path healthPath env secretEnv buildMode]
              unknown = service.keys - known
              unless unknown.empty?
                warn "services contains unknown service properties: #{unknown.join(", ")}"
                exit 1
              end

              config["services"][name] = service.reject { |key, _| key == "name" }
            end

            File.write("selfrun.yml", YAML.dump(config))
          '

      - name: Deploy with Selfrun CLI
        env:
          SELFRUN_API_KEY_SECRET: ${{ secrets.selfrun_api_key }}
          MINICLOUD_API_KEY_SECRET: ${{ secrets.minicloud_api_key }}
          POSTGRES_PASSWORD: ${{ secrets.postgres_password }}
          SELFRUN_ENV_INPUT: ${{ inputs.selfrun_environment }}
          MINICLOUD_ENV_INPUT: ${{ inputs.minicloud_environment }}
          SELFRUN_APP_DOMAIN_INPUT: ${{ inputs.selfrun_app_domain }}
          MINICLOUD_APP_DOMAIN_INPUT: ${{ inputs.minicloud_app_domain }}
          SELFRUN_API_URL_INPUT: ${{ inputs.selfrun_api_url }}
          MINICLOUD_API_URL_INPUT: ${{ inputs.minicloud_api_url }}
          APP_ID: ${{ inputs.app_id }}
          DATABASE: ${{ inputs.database }}
          XDG_CONFIG_HOME: ${{ runner.temp }}/selfrun-config
        shell: bash
        run: |
          set -euo pipefail

          TOKEN_VALUE="${SELFRUN_API_KEY_SECRET:-${MINICLOUD_API_KEY_SECRET}}"
          if [ -z "${TOKEN_VALUE}" ]; then
            echo "selfrun_api_key (or minicloud_api_key) is missing or unavailable in this repository."
            exit 1
          fi
          echo "::add-mask::${TOKEN_VALUE}"
          export SELFRUN_TOKEN="${TOKEN_VALUE}"
          export MINICLOUD_TOKEN="${TOKEN_VALUE}"

          if [ -n "${POSTGRES_PASSWORD}" ]; then
            echo "::add-mask::${POSTGRES_PASSWORD}"
          fi

          SELF_HOSTED_API_URL="${SELFRUN_API_URL_INPUT:-${MINICLOUD_API_URL_INPUT}}"
          TARGET_APP_DOMAIN="${SELFRUN_APP_DOMAIN_INPUT:-${MINICLOUD_APP_DOMAIN_INPUT}}"
          TARGET_ENVIRONMENT="${SELFRUN_ENV_INPUT:-${MINICLOUD_ENV_INPUT}}"

          if [[ -n "$SELF_HOSTED_API_URL" ]]; then
            if [[ ! "$SELF_HOSTED_API_URL" =~ ^https://[a-zA-Z0-9][a-zA-Z0-9.-]*(:[0-9]+)?/?$ ]]; then
              echo "selfrun_api_url / minicloud_api_url must be an HTTPS origin." >&2
              exit 1
            fi
            if [[ -z "$TARGET_APP_DOMAIN" ]]; then
              echo "selfrun_app_domain / minicloud_app_domain is required for a self-hosted instance." >&2
              exit 1
            fi
            export SELFRUN_API_URL="$SELF_HOSTED_API_URL"
            export MINICLOUD_API_URL="$SELF_HOSTED_API_URL"
            TARGET_ENVIRONMENT=self-hosted
          else
            case "${TARGET_ENVIRONMENT}" in
            prod)
              export SELFRUN_API_URL="https://api.cloud.muni.dev"
              export MINICLOUD_API_URL="https://api.cloud.muni.dev"
              ;;
            staging)
              export SELFRUN_API_URL="https://api.cloud-dev.muni.dev"
              export MINICLOUD_API_URL="https://api.cloud-dev.muni.dev"
              ;;
            *)
              echo "selfrun_environment / minicloud_environment must be prod or staging."
              exit 1
              ;;
            esac
          fi

          if [[ -n "$TARGET_APP_DOMAIN" ]]; then
            export SELFRUN_APP_DOMAIN="$TARGET_APP_DOMAIN"
            export MINICLOUD_APP_DOMAIN="$TARGET_APP_DOMAIN"
          fi

          args=(deploy --all --config selfrun.yml)
          if [ "${DATABASE}" = "postgres" ]; then
            if [ -z "${POSTGRES_PASSWORD}" ]; then
              echo "postgres_password is required when database is postgres."
              exit 1
            fi
            args+=(--pgpassword "${POSTGRES_PASSWORD}")
          fi

          {
            echo "## Selfrun deployment"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| App ID | \`${APP_ID}\` |"
            echo "| Selfrun environment | \`${TARGET_ENVIRONMENT}\` |"
            echo "| Database | \`${DATABASE}\` |"
            echo "| Customer workflow execution | [${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}) |"
          } >> "${GITHUB_STEP_SUMMARY}"

          selfrun "${args[@]}"
