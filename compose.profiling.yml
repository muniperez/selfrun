# Optional private operator profiling stack. Compose this after
# compose.dev.yml and compose.observability.yml; see observability/README.md.
services:
  worker:
    environment:
      OperatorProfiling__Enabled: "true"
      OperatorProfiling__Endpoint: http://otel-collector:4318
      OperatorProfiling__BearerToken: ${MINICLOUD_OPERATOR_OTLP_TOKEN:?Set MINICLOUD_OPERATOR_OTLP_TOKEN}
    networks:
      - default
      - profiling

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.120.0@sha256:85ac41c2db88d0df9bd6145e608a3cb023f5d8443868adbfbbf66efb51087917
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    environment:
      MINICLOUD_OPERATOR_OTLP_TOKEN: ${MINICLOUD_OPERATOR_OTLP_TOKEN:?Set MINICLOUD_OPERATOR_OTLP_TOKEN}
    volumes:
      - ./observability/profiling/collector.yml:/etc/otelcol-contrib/config.yaml:ro
    networks:
      - profiling
      - observability
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "validate", "--config=/etc/otelcol-contrib/config.yaml"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  prometheus:
    image: prom/prometheus:v2.55.1@sha256:2659f4c2ebb718e7695cb9b25ffa7d6be64db013daba13e05c875451cf51b0d3
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=24h
      - --storage.tsdb.retention.size=2GB
    volumes:
      - ./observability/profiling/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - profiling-prometheus-data:/prometheus
    networks:
      - profiling
    depends_on:
      otel-collector:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  tempo:
    image: grafana/tempo:2.7.2@sha256:4b0277a9b572a4b1fa43b01468e58911ec214dd69d033f2cd476596d14de9fe3
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./observability/profiling/tempo.yml:/etc/tempo/tempo.yml:ro
      - profiling-tempo-data:/var/tempo
    networks:
      - profiling
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  grafana-operator:
    image: grafana/grafana-oss:11.6.5@sha256:d552f949693c54d17c6f867ff6aeb128b021e54e923895dcf9cd6aa8176c0d74
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: operator
      GF_SECURITY_ADMIN_PASSWORD: ${MINICLOUD_OPERATOR_GRAFANA_PASSWORD:?Set MINICLOUD_OPERATOR_GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_METRICS_ENABLED: "false"
    volumes:
      - ./observability/profiling/grafana-provisioning:/etc/grafana/provisioning:ro
      - profiling-grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3101:3000"
    networks:
      - profiling
      - observability
    depends_on:
      loki:
        condition: service_healthy
      prometheus:
        condition: service_started
      tempo:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

networks:
  profiling:
    name: minicloud-operator-profiling
    driver: bridge

volumes:
  profiling-prometheus-data:
    name: minicloud-operator-prometheus-dev
  profiling-tempo-data:
    name: minicloud-operator-tempo-dev
  profiling-grafana-data:
    name: minicloud-operator-grafana-dev
