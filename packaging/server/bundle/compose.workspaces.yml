# Optional: include explicitly AND select --profile workspaces. Base Compose is unchanged.
services:
  api:
    environment:
      DevelopmentWorkspaces__ConfigurationFile: /etc/minicloud/development-workspaces.json
      DevelopmentWorkspaceGateway__Enabled: "true"
      DevelopmentWorkspaceGateway__GatewayDomain: ${MINICLOUD_WORKSPACE_GATEWAY_DOMAIN:-}
      DevelopmentWorkspaceGateway__ServiceCredentialFile: /run/secrets/workspace-gateway-credential
      DevelopmentWorkspaceGateway__RelayHost: ${MINICLOUD_WORKSPACE_RELAY_WORKER_ADDRESS:-172.29.111.2}
      DevelopmentWorkspaceGateway__MinimumRelayPort: "30000"
      DevelopmentWorkspaceGateway__MaximumRelayPort: "39999"
    secrets:
      - workspace-gateway-credential
    volumes:
      - type: bind
        source: ${MINICLOUD_SECRETS_DIR:?set MINICLOUD_SECRETS_DIR}/development-workspaces.json
        target: /etc/minicloud/development-workspaces.json
        read_only: true
        bind:
          create_host_path: false

  worker:
    environment:
      DevelopmentWorkspaces__ConfigurationFile: /etc/minicloud/development-workspaces.json
      DevelopmentWorkspaceWorker__RelayBindAddress: ${MINICLOUD_WORKSPACE_RELAY_WORKER_ADDRESS:-172.29.111.2}
      DevelopmentWorkspaceWorker__RelayMinimumPort: "30000"
      DevelopmentWorkspaceWorker__RelayMaximumPort: "39999"
      DevelopmentWorkspaceWorker__ApiBaseUrl: ${API_URL:?set API_URL}
    volumes:
      - type: bind
        source: ${MINICLOUD_SECRETS_DIR:?set MINICLOUD_SECRETS_DIR}/development-workspaces.json
        target: /etc/minicloud/development-workspaces.json
        read_only: true
        bind:
          create_host_path: false
    networks:
      private: {}
      workspace-relay:
        ipv4_address: ${MINICLOUD_WORKSPACE_RELAY_WORKER_ADDRESS:-172.29.111.2}

  workspace-gateway:
    profiles: ["workspaces"]
    # Fail closed to a deliberately unavailable image, not a floating default.
    # Set an immutable digest (or a qualified local image ID) before opting in.
    image: ${MINICLOUD_WORKSPACE_GATEWAY_IMAGE:-minicloud-workspace-gateway:not-configured}
    pull_policy: never
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      ASPNETCORE_URLS: http://+:8080
      DOTNET_EnableDiagnostics: "0"
      DevelopmentWorkspaceGateway__Enabled: "true"
      DevelopmentWorkspaceGateway__GatewayDomain: ${MINICLOUD_WORKSPACE_GATEWAY_DOMAIN:-}
      DevelopmentWorkspaceGateway__ServiceCredentialFile: /run/secrets/workspace-gateway-credential
      DevelopmentWorkspaceGateway__ControlPlaneUrl: http://api:8080
      DevelopmentWorkspaceGateway__RelayHost: ${MINICLOUD_WORKSPACE_RELAY_WORKER_ADDRESS:-172.29.111.2}
      DevelopmentWorkspaceGateway__MinimumRelayPort: "30000"
      DevelopmentWorkspaceGateway__MaximumRelayPort: "39999"
      DevelopmentWorkspaceGateway__TrustedProxyAddress: ${MINICLOUD_WORKSPACE_CADDY_ADDRESS:-172.29.110.2}
    secrets:
      - workspace-gateway-credential
    depends_on:
      api:
        condition: service_healthy
    networks:
      private: {}
      workspace-gateway-proxy:
        ipv4_address: ${MINICLOUD_WORKSPACE_GATEWAY_ADDRESS:-172.29.110.3}
      workspace-relay:
        ipv4_address: ${MINICLOUD_WORKSPACE_RELAY_GATEWAY_ADDRESS:-172.29.111.3}

  caddy:
    environment:
      MINICLOUD_WORKSPACE_GATEWAY_DOMAIN: ${MINICLOUD_WORKSPACE_GATEWAY_DOMAIN:-}
      MINICLOUD_WORKSPACE_GATEWAY_ADDRESS: ${MINICLOUD_WORKSPACE_GATEWAY_ADDRESS:-172.29.110.3}
    volumes:
      - ./Caddyfile.workspaces:/etc/caddy/Caddyfile:ro
    networks:
      private: {}
      workspace-gateway-proxy:
        ipv4_address: ${MINICLOUD_WORKSPACE_CADDY_ADDRESS:-172.29.110.2}

secrets:
  workspace-gateway-credential:
    file: ${MINICLOUD_SECRETS_DIR:?set MINICLOUD_SECRETS_DIR}/workspace-gateway-credential

networks:
  workspace-gateway-proxy:
    driver: bridge
    ipam:
      config:
        - subnet: ${MINICLOUD_WORKSPACE_PROXY_SUBNET:-172.29.110.0/24}
  workspace-relay:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: ${MINICLOUD_WORKSPACE_RELAY_SUBNET:-172.29.111.0/24}
