apiVersion: 1

datasources:
  - name: Selfrun Operator Logs
    uid: selfrun-operator-loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    editable: false
    jsonData:
      httpHeaderName1: X-Scope-OrgID
    secureJsonData:
      httpHeaderValue1: operator
  - name: Selfrun Operator Metrics
    uid: selfrun-operator-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    editable: false
  - name: Selfrun Operator Traces
    uid: selfrun-operator-tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
