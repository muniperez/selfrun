apiVersion: 1

datasources:
  - name: Minicloud Operator Logs
    uid: minicloud-operator-loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    editable: false
    jsonData:
      httpHeaderName1: X-Scope-OrgID
    secureJsonData:
      httpHeaderValue1: operator
  - name: Minicloud Operator Metrics
    uid: minicloud-operator-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    editable: false
  - name: Minicloud Operator Traces
    uid: minicloud-operator-tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
